<!doctype html>
<html lang="ko">
<head>
  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-64JBDR8WKD"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-64JBDR8WKD');
  </script>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>소원 연못 — 소원을 물고기에 담아 놓아주세요</title>
  <meta name="description" content="소원을 물고기에 담아 연못에 놓아주세요. 먹이를 5번 주면 소원이 이루어져 폭포 위 하늘 연못의 금빛 물고기가 됩니다." />
  <meta name="theme-color" content="#0b1a2e" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" />
  <link rel="stylesheet" href="/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three/build/three.module.js",
        "three/addons/": "/vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="labels"></div>

  <!-- 로딩 -->
  <div id="loading" class="loading">
    <div class="loading-fish">🐟</div>
    <p>연못에 물을 채우는 중…</p>
  </div>

  <!-- 상단 바 -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">🐟</span>
      <div>
        <h1>소원 연못</h1>
        <p class="sub" id="stats">연못을 여는 중…</p>
      </div>
      <!-- 휴대폰: 제목 대신 지금 접속한 사람 수 (누르면 누가 있는지) -->
      <button id="onlinePill" class="online-pill" hidden aria-label="지금 연못에 있는 사람"><span class="on-dot"></span><span id="onlineN">1</span>명</button>
    </div>
    <div class="top-actions">
      <button id="btnSky" class="ghost" title="하늘 연못(이루어진 소원) 보기">✦<span> 하늘 연못</span></button>
      <button id="btnList" class="ghost" title="소원 모아 보기">📜<span> 소원 모아 보기</span></button>
      <button id="btnSound" class="ghost icon" title="소리 켜기/끄기">🔇</button>
      <button id="btnPanel" class="ghost icon mobile-only" title="내 소원">🐟</button>
    </div>
  </header>

  <!-- 내 소원 패널 -->
  <aside id="panel" class="panel">
    <button class="close panel-close mobile-only" id="panelClose" aria-label="닫기">×</button>
    <!-- 소원이 없을 때 -->
    <section id="releaseView" hidden>
      <h2>소원 하나를 물고기에 담아 보세요</h2>
      <p class="hint">소원을 담은 물고기에게 <b>먹이</b>를 <b id="goalText">5</b>번 주면 소원이 이루어져 폭포 위 하늘 연못으로 올라가요. 내가 줘도, 친구가 줘도 좋아요.</p>

      <label class="field">
        <span>나의 소원</span>
        <input id="wishInput" maxlength="60" placeholder="예) 엄마가 오래오래 건강하시길" />
      </label>

      <div class="field">
        <span>소원을 담을 물고기</span>
        <div id="speciesPicker" class="species"></div>
      </div>

      <label class="check">
        <input type="checkbox" id="publicInput" checked />
        <span>다른 사람에게 소원 보여주기 (끄면 ‘마음속 소원’으로 보여요)</span>
      </label>

      <button id="btnRelease" class="primary">🙏 방생하러 가기</button>
    </section>

    <!-- 내 소원이 헤엄치는 중 -->
    <section id="myView" hidden>
      <div class="dream-head">
        <span id="myName" class="fish-name"></span>
        <span id="myBadge" class="badge"></span>
      </div>
      <h2 id="myText" class="dream-text"></h2>
      <div class="falls">
        <div class="falls-bar"><div id="myFill" class="falls-fill"></div></div>
        <p id="myLabel" class="falls-label"></p>
      </div>
      <button id="btnShareWish" class="share-wish">🔗 내 소원에 먹이 주러 와 줘 — 링크 복사</button>
      <button id="btnFeedMine" class="primary feed-mine">✨ 내 소원에 먹이 주기</button>
      <p class="hint tip">💡 다른 물고기를 눌러 소원을 읽고 먹이로 응원해 보세요. 연못을 누르면 내 물고기가 그곳으로 헤엄쳐요.</p>
      <div class="panel-foot"><button id="btnDeleteMine" class="link">소원 지우기</button></div>
    </section>

    <!-- 이루어진 내 소원 -->
    <section id="myStars" class="my-stars" hidden>
      <h3>이루어진 내 소원</h3>
      <ul id="myStarList"></ul>
    </section>
  </aside>

  <!-- 소원 카드 (물고기를 눌렀을 때) -->
  <div id="wishCard" class="fish-card" hidden>
    <button class="close" id="cardClose" aria-label="닫기">×</button>
    <p class="fish-name" id="cardName"></p>
    <p class="dream-text" id="cardText"></p>
    <div class="falls small" id="cardFalls">
      <div class="falls-bar"><div id="cardFill" class="falls-fill"></div></div>
      <p id="cardLabel" class="falls-label"></p>
    </div>
    <div class="card-actions">
      <button id="btnFeed" class="primary small">✨ 먹이 주기</button>
      <button id="btnReport" class="small report" title="욕설·광고·개인정보 등">🚩 신고</button>
      <button id="btnDelete" class="small report" hidden title="내 소원 지우기">🗑 지우기</button>
      <button id="btnCheerTo" class="small" hidden>💛 응원 보내기</button>
      <button id="btnFollow" class="small" hidden>🐟 같이 헤엄치기</button>
    </div>
  </div>

  <!-- 아래 버튼 막대 (유리 느낌) + 안내 -->
  <div class="bottom-bars">
    <p id="steerHint" class="steer-hint">물고기를 누르면 소원이 보여요 · 연못을 누르면 내 물고기가 그곳으로 헤엄쳐요</p>
  </div>
  <nav class="action-bar" id="actionBar" aria-label="내 물고기">
    <button id="actSwim"><span class="ic">🌊</span><span class="lb">헤엄</span></button>
    <button id="actWish"><span class="ic">🙏</span><span class="lb">소원</span></button>
    <button id="actFeed"><span class="ic">✨</span><span class="lb">먹이주기</span><span class="badge-n" id="feedBadge" hidden></span></button>
    <button id="actCheer"><span class="ic">💛</span><span class="lb">응원</span></button>
    <button id="actSay" aria-expanded="false"><span class="ic">💬</span><span class="lb">말</span></button>
  </nav>
  <!-- 정해진 말 고르기 (💬 말) -->
  <div id="sayPop" class="say-pop" hidden role="menu" aria-label="말 고르기">
    <p id="sayTo" class="say-to"></p>
    <div id="sayList" class="say-list"></div>
  </div>

  <!-- 방생 의식 -->
  <div id="ritual" class="ritual" hidden>
    <div class="ritual-box">
      <p class="ritual-step" id="ritualStep">1 / 3</p>
      <h2 id="ritualTitle"></h2>
      <p class="ritual-wish" id="ritualWish"></p>
      <!-- 1. 목어 -->
      <button id="mokeo" class="mokeo" aria-label="목어 두드리기">
        <svg viewBox="0 0 200 100" aria-hidden="true">
          <defs>
            <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#c98a4b" /><stop offset="1" stop-color="#7a4520" />
            </linearGradient>
          </defs>
          <path d="M18 50 C40 12 120 8 160 34 L192 16 L186 50 L192 84 L160 66 C120 92 40 88 18 50 Z" fill="url(#wood)" stroke="#4a2810" stroke-width="3" />
          <path d="M60 30 C80 46 80 54 60 70 M84 26 C104 46 104 54 84 74 M108 26 C128 46 128 54 108 74" fill="none" stroke="#5a3314" stroke-width="3" opacity=".6" />
          <circle cx="38" cy="44" r="7" fill="#fff3d6" stroke="#4a2810" stroke-width="2" />
          <circle cx="38" cy="44" r="3" fill="#2a1408" />
          <path d="M20 54 Q30 58 40 56" stroke="#4a2810" stroke-width="3" fill="none" />
        </svg>
      </button>
      <div class="ritual-dots" id="mokeoDots"><i></i><i></i><i></i></div>
      <!-- 2. 합장 -->
      <button id="pray" class="pray" hidden aria-label="눌러서 두 손 모으기">
        <svg viewBox="0 0 120 120" class="ring"><circle cx="60" cy="60" r="54" /><circle id="prayRing" cx="60" cy="60" r="54" /></svg>
        <span>🙏</span>
      </button>
      <p class="ritual-help" id="ritualHelp"></p>
      <button class="link" id="ritualCancel">그만두기</button>
    </div>
  </div>

  <!-- 소원 모아 보기 -->
  <div id="listModal" class="list-modal" hidden>
    <div class="list-box">
      <header class="list-head">
        <h2>소원 모아 보기</h2>
        <button class="close" id="listClose" aria-label="닫기">×</button>
      </header>
      <nav class="list-tabs" id="listTabs">
        <button data-tab="swimming" class="on">🐟 헤엄치는 소원</button>
        <button data-tab="star">✦ 이루어진 소원</button>
        <button data-tab="mine">내 소원</button>
      </nav>
      <div class="list-sort" id="listSort">
        <button data-sort="new" class="on">새로운 순</button>
        <button data-sort="near">곧 이루어질 순</button>
      </div>
      <ul class="list-items" id="listItems"></ul>
    </div>
  </div>

  <!-- 휴대폰: 화면은 넓게, 아래 작은 막대 하나 -->
  <div id="miniBar" class="mini-bar">
    <div class="mini-info">
      <p id="miniText"></p>
      <p id="miniSub"></p>
    </div>
    <button id="miniFeed" class="primary small" hidden>✨ 먹이</button>
    <button id="miniOpen" class="small"></button>
  </div>

  <div id="toasts" class="toasts"></div>
  <div id="celebrate" class="celebrate" hidden></div>
  <div id="caption" class="caption"></div>
  <div class="letterbox top"></div>
  <div class="letterbox bottom"></div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
